<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canal · StreamLab</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    [hidden] { display: none !important; }

    .channel-info__header { align-items: center; }
    .channel-info__who { flex: 1; min-width: 0; }
    .channel-info__who .channel-info__title { overflow-wrap: anywhere; }
    .channel-info__name { color: var(--accent); font-weight: 600; }

    .pill-live {
      background: var(--live);
      color: #fff;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .04em;
      padding: .15rem .45rem;
      border-radius: 4px;
      line-height: 1.3;
    }

    .vod-banner {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .6rem 1.25rem;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
      font-size: .85rem;
      color: var(--muted);
    }

    .vod-banner span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .channel-vods { padding: 1rem 1.25rem 1.5rem; }

    .chat-msg a { color: var(--accent); }
    .chat-form .btn { flex-shrink: 0; }
    .chat-form input:disabled { opacity: .55; cursor: not-allowed; }
  </style>
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <div class="channel-layout">

    <!-- ── Reproductor + información ──────────────────────────────────────── -->
    <section class="channel-main">
      <div class="player-wrap">
        <video id="player" controls autoplay muted playsinline hidden></video>
        <div class="player-offline" id="player-offline">
          <div class="player-offline__icon">📺</div>
          <p id="offline-text">Cargando canal…</p>
        </div>
      </div>

      <div class="vod-banner" id="vod-banner" hidden>
        <span id="vod-banner-text">Estás viendo una grabación</span>
        <button type="button" class="btn btn-ghost btn-sm" id="vod-back">Volver</button>
      </div>

      <div class="channel-info">
        <div class="channel-info__header">
          <div id="ch-avatar"></div>
          <div class="channel-info__who">
            <h1 class="channel-info__title" id="ch-title">Cargando…</h1>
            <div class="channel-info__meta">
              <a class="channel-info__name" id="ch-name" href="#"></a>
              <span id="ch-category"></span>
              <span id="ch-followers"></span>
              <span class="pill-live" id="ch-live" hidden>EN VIVO</span>
            </div>
          </div>
          <button type="button" class="btn-follow" id="btn-follow" hidden>Seguir</button>
        </div>
        <p class="channel-info__bio" id="ch-bio" hidden></p>
      </div>

      <div class="channel-vods" id="vods-section" hidden>
        <h2 class="section-title">Grabaciones</h2>
        <div class="vod-list" id="vod-list"></div>
      </div>
    </section>

    <!-- ── Chat lateral ───────────────────────────────────────────────────── -->
    <aside class="chat-panel" aria-label="Chat del canal">
      <div class="chat-panel__header">
        <span>Chat</span>
        <span class="chat-panel__viewers" id="viewers">0 espectadores</span>
      </div>
      <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
      <form class="chat-form" id="chat-form" autocomplete="off">
        <input id="chat-input" type="text" maxlength="300" placeholder="Escribe un mensaje" aria-label="Mensaje">
        <button type="submit" class="btn btn-primary btn-sm" id="chat-send">Enviar</button>
      </form>
    </aside>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/hls.js"></script>
  <script src="/common.js"></script>
  <script>
    (async function () {
      'use strict';

      const MAX_RETRIES = 40;     // ~80 s esperando a que el servidor genere la lista HLS
      const MAX_CHAT_ROWS = 200;

      const $ = (id) => document.getElementById(id);

      const video       = $('player');
      const offlineEl   = $('player-offline');
      const offlineText = $('offline-text');
      const vodBanner   = $('vod-banner');
      const vodBannerTx = $('vod-banner-text');
      const vodBack     = $('vod-back');
      const chAvatar    = $('ch-avatar');
      const chTitle     = $('ch-title');
      const chName      = $('ch-name');
      const chCategory  = $('ch-category');
      const chFollowers = $('ch-followers');
      const chLive      = $('ch-live');
      const chBio       = $('ch-bio');
      const btnFollow   = $('btn-follow');
      const vodsSection = $('vods-section');
      const vodList     = $('vod-list');
      const viewersEl   = $('viewers');
      const msgsEl      = $('chat-messages');
      const chatForm    = $('chat-form');
      const chatInput   = $('chat-input');
      const chatSend    = $('chat-send');

      const match = location.pathname.match(/^\/c\/([^/]+)/);
      let username = '';
      try { username = match ? decodeURIComponent(match[1]).toLowerCase() : ''; } catch (_) {}

      let channel   = null;
      let me        = null;
      let following = false;
      let mode      = 'offline';   // 'live' | 'offline' | 'vod'
      let hls       = null;
      let retries   = 0;
      let liveTimer = null;

      /* ── Utilidades ───────────────────────────────────────────────────────── */
      const isLive = () => !!(channel && (channel.is_live ?? channel.live));

      function apiError(err) {
        return err && err.status ? err.message : 'No se pudo conectar con el servidor.';
      }

      function formatSize(bytes) {
        const n = Number(bytes);
        if (!Number.isFinite(n) || n <= 0) return '';
        if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
        if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
        return Math.max(1, Math.round(n / 1024)) + ' KB';
      }

      function baseName(url) {
        let name = String(url || '').split('?')[0].split('/').pop() || 'Grabación';
        try { name = decodeURIComponent(name); } catch (_) {}
        return name.replace(/\.mp4$/i, '');
      }

      function normalizeVod(v) {
        const raw = typeof v === 'string' ? { url: v } : (v || {});
        let url = raw.url || raw.path || raw.src || raw.file || '';
        // El servidor manda { file, size_mb }: el nombre del archivo cuelga de /media/live/<usuario>/
        if (url && !/^(\/|https?:)/i.test(url)) {
          url = '/media/live/' + encodeURIComponent(username) + '/' + encodeURIComponent(url);
        }
        return {
          url,
          name: raw.title || raw.name || baseName(url),
          size: raw.size_mb != null ? raw.size_mb + ' MB' : formatSize(raw.size)
        };
      }

      /* ── Reproductor ──────────────────────────────────────────────────────── */
      function stopPlayer() {
        clearTimeout(liveTimer);
        if (hls) { hls.destroy(); hls = null; }
        video.pause();
        video.removeAttribute('src');
        video.load();
      }

      function setMode(next) {
        mode = next;
        video.hidden = next === 'offline';
        offlineEl.hidden = next !== 'offline';
        vodBanner.hidden = next !== 'vod';
        if (next === 'offline') {
          offlineText.textContent = channel
            ? 'Este canal no está transmitiendo ahora mismo.'
            : 'Este canal no existe.';
        }
      }

      function startLive() {
        stopPlayer();
        setMode('live');
        retries = 0;

        const src = (channel && typeof channel.hls === 'string' && channel.hls)
          ? channel.hls
          : '/media/live/' + encodeURIComponent(username) + '/index.m3u8';

        if (window.Hls && Hls.isSupported()) {
          const instance = new Hls({ liveSyncDurationCount: 3 });
          hls = instance;
          instance.loadSource(src);
          instance.attachMedia(video);

          instance.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
          instance.on(Hls.Events.FRAG_LOADED, () => { retries = 0; });
          instance.on(Hls.Events.ERROR, (_evt, data) => {
            if (hls !== instance || !data.fatal) return;

            if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              instance.recoverMediaError();
              return;
            }
            if (++retries > MAX_RETRIES) {
              toast('No se pudo reproducir el directo. Recarga la página.', 'error');
              return;
            }
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              // La lista HLS tarda unos segundos en existir tras conectar OBS
              setTimeout(() => { if (hls === instance) instance.startLoad(); }, 2000);
            } else {
              liveTimer = setTimeout(() => { if (mode === 'live') startLive(); }, 2000);
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = src;
          video.play().catch(() => {});
        } else {
          setMode('offline');
          offlineText.textContent = 'Tu navegador no puede reproducir este directo (HLS).';
        }
      }

      function goOffline() {
        stopPlayer();
        setMode('offline');
      }

      function playVod(vod) {
        stopPlayer();
        setMode('vod');
        vodBannerTx.textContent = 'Grabación: ' + vod.name;
        vodBack.textContent = isLive() ? 'Volver al directo' : 'Cerrar';
        video.muted = false;
        video.src = vod.url;
        video.play().catch(() => {});
      }

      vodBack.addEventListener('click', () => {
        if (isLive()) startLive();
        else goOffline();
      });

      /* ── Pintado de la información del canal ──────────────────────────────── */
      function renderStatus() {
        chLive.hidden = !isLive();
      }

      function renderFollowers() {
        const n = Number(channel && channel.followers) || 0;
        chFollowers.textContent = n + (n === 1 ? ' seguidor' : ' seguidores');
      }

      function renderFollow() {
        const own = me && channel && me.username === channel.username;
        btnFollow.hidden = !channel || own;
        btnFollow.textContent = following ? 'Siguiendo' : 'Seguir';
        btnFollow.classList.toggle('active', following);
        btnFollow.setAttribute('aria-pressed', String(following));
      }

      function renderVods() {
        const vods = (channel && Array.isArray(channel.vods) ? channel.vods : [])
          .map(normalizeVod)
          .filter((v) => v.url);

        vodsSection.hidden = vods.length === 0;
        vodList.textContent = '';

        vods.forEach((vod) => {
          const row = document.createElement('div');
          row.className = 'vod-item';

          const name = document.createElement('span');
          name.className = 'vod-item__name';
          name.textContent = vod.name;
          row.appendChild(name);

          if (vod.size) {
            const size = document.createElement('span');
            size.className = 'vod-item__size';
            size.textContent = vod.size;
            row.appendChild(size);
          }

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn btn-ghost btn-sm';
          btn.textContent = 'Ver';
          btn.addEventListener('click', () => playVod(vod));
          row.appendChild(btn);

          vodList.appendChild(row);
        });
      }

      function renderChannel() {
        const name = channel.username || username;
        document.title = name + ' · StreamLab';
        chAvatar.innerHTML = avatar(name, 44);
        chTitle.textContent = channel.title || 'Sin título';
        chName.textContent = name;
        chName.href = '/c/' + encodeURIComponent(name);
        chCategory.textContent = channel.category || 'Sin categoría';
        chBio.textContent = channel.bio || '';
        chBio.hidden = !channel.bio;
        renderStatus();
        renderFollowers();
        renderFollow();
        renderVods();
      }

      /* ── Seguir ───────────────────────────────────────────────────────────── */
      btnFollow.addEventListener('click', async () => {
        if (!me) {
          window.location.href = '/login.html';
          return;
        }
        btnFollow.disabled = true;
        try {
          const was = following;
          const r = await api('/api/channels/' + encodeURIComponent(username) + '/follow', { method: 'POST' });
          following = typeof r.following === 'boolean' ? r.following : !following;
          if (following !== was) {
            channel.followers = Math.max(0, (Number(channel.followers) || 0) + (following ? 1 : -1));
          }
          renderFollow();
          renderFollowers();
          toast(following ? 'Ahora sigues a ' + username + '.' : 'Dejaste de seguir a ' + username + '.');
        } catch (err) {
          toast(apiError(err), 'error');
        } finally {
          btnFollow.disabled = false;
        }
      });

      /* ── Chat ─────────────────────────────────────────────────────────────── */
      function pushRow(node) {
        const nearBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 80;
        msgsEl.appendChild(node);
        while (msgsEl.children.length > MAX_CHAT_ROWS) msgsEl.firstChild.remove();
        if (nearBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
      }

      function addSystem(text, linkHref, linkText) {
        const row = document.createElement('div');
        row.className = 'chat-msg chat-msg--system';
        row.textContent = text;
        if (linkHref) {
          const a = document.createElement('a');
          a.href = linkHref;
          a.textContent = linkText;
          row.append(' ', a);
        }
        pushRow(row);
      }

      function addChat(msg) {
        const row = document.createElement('div');
        row.className = 'chat-msg';

        if (msg.at) {
          const d = new Date(msg.at);
          if (!isNaN(d)) row.title = d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
        }

        const user = document.createElement('span');
        user.className = 'chat-msg__user';
        user.style.color = msg.color || colorFor(String(msg.user || ''));
        user.textContent = String(msg.user || '?') + ':';

        const text = document.createElement('span');
        text.textContent = String(msg.text || '');

        row.append(user, text);
        pushRow(row);
      }

      function setViewers(n) {
        const count = Number(n) || 0;
        viewersEl.textContent = count + (count === 1 ? ' espectador' : ' espectadores');
      }

      /* ── Arranque ─────────────────────────────────────────────────────────── */
      const topbarPromise = renderTopbar('');

      let loadError = null;
      if (username) {
        try {
          channel = await api('/api/channels/' + encodeURIComponent(username));
        } catch (err) {
          loadError = err;
        }
      }
      me = await topbarPromise;

      if (!channel) {
        chTitle.textContent = 'Canal no encontrado';
        chCategory.textContent = '';
        setMode('offline');
        offlineText.textContent = loadError && loadError.status && loadError.status !== 404
          ? loadError.message
          : 'Este canal no existe.';
        chatInput.disabled = true;
        chatSend.disabled = true;
        return;
      }

      following = !!channel.following;
      renderChannel();

      if (isLive()) startLive();
      else setMode('offline');

      if (me) {
        addSystem('Bienvenido al chat de ' + (channel.username || username) + '.');
      } else {
        chatInput.disabled = true;
        chatSend.disabled = true;
        chatInput.placeholder = 'Inicia sesión para chatear';
        addSystem('Para chatear,', '/login.html', 'inicia sesión');
      }

      const socket = (typeof io === 'function') ? io() : null;

      if (socket) {
        // Al (re)conectar hay que volver a entrar en la sala del canal
        socket.on('connect', () => socket.emit('join', username));

        socket.on('chat', addChat);
        socket.on('viewers', (ev) => setViewers(ev && ev.n));
        socket.on('chat:error', (ev) => {
          toast((ev && ev.texto) || 'No se pudo enviar el mensaje.', 'warn');
        });

        socket.on('channel:update', (ev) => {
          if (!ev) return;
          if (ev.title !== undefined) channel.title = ev.title;
          if (ev.category !== undefined) channel.category = ev.category;
          chTitle.textContent = channel.title || 'Sin título';
          chCategory.textContent = channel.category || 'Sin categoría';
        });

        socket.on('live', (ev) => {
          if (!ev || ev.username !== (channel.username || username)) return;
          channel.is_live = ev.live ? 1 : 0;
          renderStatus();
          if (mode === 'vod') {
            vodBack.textContent = ev.live ? 'Volver al directo' : 'Cerrar';
            return;
          }
          clearTimeout(liveTimer);
          if (ev.live) {
            // OBS acaba de conectar: la lista HLS tarda unos segundos en existir
            liveTimer = setTimeout(startLive, 2500);
          } else {
            goOffline();
          }
        });
      } else {
        addSystem('El chat no está disponible.');
      }

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text || !me || !socket) return;
        socket.emit('chat', text);
        chatInput.value = '';
        chatInput.focus();
      });
    })();
  </script>
</body>
</html>
